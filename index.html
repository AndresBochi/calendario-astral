<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b23a2e">
  <title>Calendario Astral</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css?v=40">
</head>
<body>
  <main class="page">
    <div class="rings" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>

    <header class="cal-head">
      <div class="head-row">
        <span class="app-name">Calendario Astral</span>
        <div class="controls">
          <button id="todayBtn" class="chip" type="button" data-i18n="today" hidden></button>
          <button id="supportBtn" class="chip" type="button" aria-label="Support"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
          <button id="langBtn" class="chip" type="button" aria-label="Language">EN</button>
          <button id="colorBtn" class="chip" type="button" aria-label="Colors"><span class="swatch"></span></button>
          <button id="themeBtn" class="chip" type="button" aria-label="Theme"></button>
        </div>
      </div>
      <div class="head-row nav">
        <div class="stepper">
          <button id="prevMonth" class="arrow" type="button" aria-label="Previous month">‹</button>
          <span id="month" class="month"></span>
          <button id="nextMonth" class="arrow" type="button" aria-label="Next month">›</button>
        </div>
        <div class="stepper">
          <button id="prevYear" class="arrow" type="button" aria-label="Previous year">‹</button>
          <span id="year" class="year"></span>
          <button id="nextYear" class="arrow" type="button" aria-label="Next year">›</button>
        </div>
      </div>
    </header>

    <section id="installBar" class="install-bar" hidden>
      <span data-i18n="installText"></span>
      <button id="installBtn" class="loc-btn" type="button" data-i18n="install"></button>
      <button id="installClose" class="loc-close" type="button" aria-label="Close">×</button>
    </section>

    <section id="colorPanel" class="loc-panel" hidden>
      <div class="loc-panel-head">
        <h3 data-i18n="customize"></h3>
        <button id="colorClose" class="loc-close" type="button" aria-label="Close">×</button>
      </div>
      <h3 data-i18n="colorsTitle"></h3>
      <label class="color-row"><input id="primaryPick" type="color"><span data-i18n="primaryColor"></span></label>
      <label class="color-row"><input id="secondaryPick" type="color"><span data-i18n="secondaryColor"></span></label>
      <button id="colorReset" class="loc-btn" type="button" data-i18n="resetColors"></button>
      <h3 data-i18n="fontTitle"></h3>
      <div class="layout-row">
        <div id="fontSeg" class="font-choices">
          <button type="button" data-font="normal" data-i18n="fontNormal"></button><select id="fontPick" aria-label="Font"></select><button type="button" data-font="dyslexic">OpenDyslexic</button>
        </div>
      </div>
      <p class="loc-help" data-i18n="fontNote"></p>
      <h3 data-i18n="layoutTitle"></h3>
      <div id="colsRow" class="layout-row">
        <span data-i18n="columns"></span>
        <div id="colsSeg" class="seg">
          <button type="button" data-cols="1">1</button><button type="button" data-cols="2">2</button>
        </div>
      </div>
      <p id="colsNote" class="loc-help" hidden></p>
      <div class="layout-row">
        <button id="layoutEdit" class="loc-btn" type="button" data-i18n="editLayout"></button>
        <button id="layoutReset" class="loc-btn" type="button" data-i18n="resetLayout"></button>
      </div>
    </section>

    <section id="supportPanel" class="loc-panel" hidden>
      <div class="loc-panel-head">
        <h3 data-i18n="supportTitle"></h3>
        <button id="supportClose" class="loc-close" type="button" aria-label="Close">×</button>
      </div>
      <p class="support-text" data-i18n="supportText"></p>
      <a id="donateBtn" class="loc-btn" target="_blank" rel="noopener" data-i18n="donate"></a>
      <div id="apkBlock" class="support-block">
        <h3 data-i18n="apkTitle"></h3>
        <p class="support-text" data-i18n="apkText"></p>
        <a id="apkBtn" class="loc-btn" data-i18n="downloadApk"></a>
        <p class="loc-help" data-i18n="apkHelp"></p>
      </div>
      <p id="apkElsewhere" class="loc-help" data-i18n="apkOnlyAndroid" hidden></p>
    </section>

    <section id="locPanel" class="loc-panel" hidden>
      <div class="loc-panel-head">
        <h3 data-i18n="locTitle"></h3>
        <button id="locClose" class="loc-close" type="button" aria-label="Close">×</button>
      </div>
      <button id="gpsBtn" class="loc-btn" type="button" data-i18n="useLocation"></button>
      <p id="locHelp" class="loc-help" hidden></p>
      <form id="citySearch" class="city-search">
        <label for="cityInput" data-i18n="searchCity"></label>
        <div class="city-row">
          <input id="cityInput" type="search" autocomplete="off" enterkeyhint="search">
          <button class="loc-btn" type="submit" data-i18n="search"></button>
        </div>
      </form>
      <ul id="cityResults" class="city-results"></ul>
    </section>

    <div id="board" class="board">
      <div class="mod" data-mod="today">
        <section class="today">
          <div class="today-date">
            <div id="weekday" class="weekday"></div>
            <div id="daynum" class="daynum"></div>
            <button id="dmyBtn" class="dmy" type="button">
              <span id="dmy"></span>
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <input id="datePick" class="date-pick" type="date" tabindex="-1" aria-hidden="true">
          </div>
          <div class="today-time">
            <div class="label" data-i18n="time"></div>
            <button id="clock" class="clock" type="button"></button>
            <span id="timePick" class="time-pick" hidden>
              <select id="pickHour" aria-label="Hour"></select>:<select id="pickMinute" aria-label="Minute"></select>
            </span>
            <button id="nowBtn" class="loc-btn now-btn" type="button" data-i18n="resumeNow" hidden></button>
          </div>
          <div id="location" class="loc"></div>
        </section>
      </div>
      <div class="mod" data-mod="days">
        <section class="days" id="days" aria-label="days"></section>
      </div>
      <div class="mod" data-mod="sun">
        <article class="cell sun">
          <header class="cell-head">
            <span class="body-glyph">☉</span>
            <h2 data-i18n="sun"></h2>
          </header>
          <div class="big-sign">
            <span id="sunSignGlyph" class="sign-glyph"></span>
            <span id="sunSign" class="sign-name"></span>
          </div>
          <dl class="facts">
            <div><dt data-i18n="degInSign"></dt><dd id="sunDeg"></dd></div>
            <div><dt data-i18n="degTotal"></dt><dd id="sunTotal"></dd></div>
            <div><dt data-i18n="sunrise"></dt><dd id="sunRise"></dd></div>
            <div><dt data-i18n="sunset"></dt><dd id="sunSet"></dd></div>
            <div><dt data-i18n="azimuth"></dt><dd id="sunAz"></dd></div>
            <div><dt data-i18n="altitude"></dt><dd id="sunAlt"></dd></div>
            <div><dt data-i18n="maxAltitude"></dt><dd id="sunMax"></dd></div>
          </dl>
        </article>
      </div>
      <div class="mod" data-mod="moon">
        <article class="cell moon">
          <header class="cell-head">
            <span class="body-glyph">☽</span>
            <h2 data-i18n="moon"></h2>
          </header>
          <div class="moon-top">
            <div id="moonIcon" class="moon-icon"></div>
            <div>
              <div id="moonPhase" class="phase-name"></div>
              <div id="moonIllum" class="illum"></div>
            </div>
          </div>
          <dl class="facts">
            <div><dt data-i18n="sign"></dt><dd id="moonSign"></dd></div>
            <div><dt data-i18n="degTotal"></dt><dd id="moonTotal"></dd></div>
            <div><dt data-i18n="ascent"></dt><dd id="moonAscent"></dd></div>
            <div><dt data-i18n="anomalistic"></dt><dd id="moonApsis"></dd></div>
            <div><dt data-i18n="moonrise"></dt><dd id="moonRise"></dd></div>
            <div><dt data-i18n="moonset"></dt><dd id="moonSet"></dd></div>
            <div><dt data-i18n="azimuth"></dt><dd id="moonAz"></dd></div>
            <div><dt data-i18n="altitude"></dt><dd id="moonAlt"></dd></div>
            <div><dt data-i18n="maxAltitude"></dt><dd id="moonMax"></dd></div>
          </dl>
        </article>
      </div>
      <div class="mod" data-mod="planets">
        <section class="planets">
          <h3 data-i18n="planets"></h3>
          <ul id="planetList"></ul>
        </section>
      </div>
    </div>

    <footer class="foot" data-i18n="footnote"></footer>
    <button id="layoutDone" class="loc-btn layout-done" type="button" data-i18n="done" hidden></button>
  </main>

  <script src="vendor/astronomy.browser.min.js?v=2.1.19"></script>
  <script src="vendor/tz-lookup.js?v=11.7.0"></script>
  <script src="app.js?v=39"></script>
</body>
</html>
